name: Daily SEO Indexing

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-auth requests

      - name: Create key.json from Secret
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > key.json

      - name: Run Indexing Script
        run: |
          python3 index.py

      - name: Commit and push updated state
        run: |
          git config --global user.name "Indexing Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index_state.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update indexing state [skip ci]" && git push)
